services:
  samadhan-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: samadhan_portal
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_HOST=samadhan-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=samadhan_root_password
      - DB_NAME=samadhan_db
      - JWT_SECRET=samadhan_production_secret_jwt_key_2026
    depends_on:
      samadhan-db:
        condition: service_healthy

  samadhan-db:
    image: mysql:8.0
    container_name: samadhan_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: samadhan_root_password
      MYSQL_DATABASE: samadhan_db
    ports:
      - "3307:3306"
    volumes:
      - samadhan_db_data:/var/lib/mysql
      - ./u578256029_samadhan (2).sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psamadhan_root_password"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  samadhan_db_data:
    driver: local
